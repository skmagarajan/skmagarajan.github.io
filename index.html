<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saravana Krishnan Magarajan Portfolio</title>

    <!-- Pickleball Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Star Wars Style Starfield Layers -->
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div id="nav-placeholder"></div>
    <div id="hero-placeholder"></div>
    <div id="about-placeholder"></div>
    <div id="projects-placeholder"></div>
    <div id="skills-placeholder"></div>
    <div id="contact-placeholder"></div>
    <div id="footer-placeholder"></div>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script>
    <script>
        async function loadSection(id, file) {
            const res = await fetch(file);
            const html = await res.text();
            document.getElementById(id).innerHTML = html;
        }
        Promise.all([
            loadSection('nav-placeholder', 'sections/nav.html'),
            loadSection('hero-placeholder', 'sections/hero.html'),
            loadSection('about-placeholder', 'sections/about.html'),
            loadSection('projects-placeholder', 'sections/projects.html'),
            loadSection('skills-placeholder', 'sections/skills.html'),
            loadSection('contact-placeholder', 'sections/contact.html'),
            loadSection('footer-placeholder', 'sections/footer.html'),
        ]).then(() => {
            const s = document.createElement('script');
            s.src = 'scripts.js';
            document.body.appendChild(s);
        });
    </script>
</body>
</html>
